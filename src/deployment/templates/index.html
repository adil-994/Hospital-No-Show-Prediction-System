<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital No-Show Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="text-center mb-4">Patient No-Show Predictor</h2>
                    <p class="text-muted text-center">Enter details to check appointment attendance risk.</p>
                    
                    <form action="/predict" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age</label>
                                <input type="number" name="Age" class="form-control" required placeholder="e.g. 45">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Wait Days</label>
                                <input type="number" name="waiting_days" class="form-control" required placeholder="Days since booking">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Weather: Precipitation (mm)</label>
                            <input type="number" step="0.1" name="precipitation_sum" class="form-control" required placeholder="e.g. 5.0">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">SMS Received?</label>
                            <select name="SMS_received" class="form-select">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Check Risk Status</button>
                    </form>

                    {% if prediction_text %}
                    <div class="mt-4 alert alert-{{ result_class }} text-center">
                        <h4>{{ prediction_text }}</h4>
                        <p class="mb-0">Confidence Score: {{ confidence }}</p>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
